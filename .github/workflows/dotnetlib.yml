name: .NET

on:
  workflow_call:
    inputs:
        publishToNuget:
          description: 'Request preview publication (requires approval)'
          required: false
          default: false
          type: boolean
        nugetUser:
          description: 'NuGet.org username configured for Trusted Publishing'
          required: true
          type: string
        sourceDirectoryPath:
          description: 'Path for all source code'
          default: 'src'
          type: string
        runOnImageName:
          description: 'Image target name (ubuntu, windows, ...)'
          default: 'ubuntu'
          type: string
        runOnImageVersion:
          description: 'Image target version (latest, 20.04, ...)'
          default: 'latest'
          type: string
        dotnet-version:
          description: 'Dotnet versions.'
          default: |
            9.0.x
          type: string
        addSupportForWindowsSdk:
          description: 'Add support for Windows SDK'
          default: false
          type: boolean
        windowsSdkVersion:
          description: 'Windows SDK version to install'
          default: '22100'
          type: string
    secrets:
        NUGETPACKAGEIDENTIFIER:
            required: true

jobs:
  build:
    name: "CI: Build, test and pack"
    runs-on: '${{ inputs.runOnImageName }}-${{ inputs.runOnImageVersion }}'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_publish: ${{ steps.release-check.outputs.release_publish }}

    steps:
    - name: Checkout workflows repo # required so we can reference the actions locally
      uses: actions/checkout@v4

    # Show informations :
    - name: Show context information
      run: |
        echo "GitHub ref: ${{ github.ref }}"
        echo "GitHub head_ref: ${{ github.head_ref }}"
        echo "Preview publication requested: ${{ inputs.publishToNuget }}"
        echo "PR Number: ${{ github.event.pull_request.number }}"

    # Install java last version for Sonar
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: 'zulu' # Alternative distribution options are available.
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Add support for Windows SDK
      if: ${{ inputs.addSupportForWindowsSdk }}
      uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
      with:
        sdk-version: ${{ inputs.windowsSdkVersion }}
    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore
      working-directory: ${{ inputs.sourceDirectoryPath }}

    - name: Generate build version
      id: generate-version
      uses: mathieumack/MyGithubActions/actions/nugetversion@main
      with:
        nugetPackageIdentifier: '${{ secrets.NUGETPACKAGEIDENTIFIER }}'

    - name: Build and test dotnet projects
      id: buildandanalyze
      uses: mathieumack/MyGithubActions/actions/buildandtestdotnet@main
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        version: '${{ steps.generate-version.outputs.buildversion }}'
        workingDirectory: '${{ inputs.sourceDirectoryPath }}'

    - uses: actions/upload-artifact@v4
      with:
        name: nuget-artifact
        path: ${{ inputs.sourceDirectoryPath }}/**/*.nupkg

    - name: Check whether main push came from a pull request
      id: release-check
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        GH_API_URL: ${{ github.api_url }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        $headers = @{
          Authorization = "Bearer " + $env:GH_TOKEN
          Accept = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
        }
        try {
          $pulls = @(
            Invoke-RestMethod `
              -Uri "$env:GH_API_URL/repos/$env:GH_REPOSITORY/commits/$env:GH_SHA/pulls" `
              -Headers $headers
          )
          $mergedPulls = @(
            $pulls | Where-Object {
              $_.merged_at -and $_.base.ref -eq "main"
            }
          )
          $shouldPublish = ($mergedPulls.Count -gt 0).ToString().ToLowerInvariant()
        } catch {
          Write-Warning "Could not verify that the commit came from a pull request: $_"
          $shouldPublish = "false"
        }
        "release_publish=$shouldPublish" >> $env:GITHUB_OUTPUT

  publish-preview:
    name: "CD: Publish preview"
    needs: build
    if: >-
      inputs.publishToNuget &&
      (
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/copilot/') ||
        startsWith(github.head_ref, 'feature/') ||
        startsWith(github.head_ref, 'copilot/')
      )
    runs-on: '${{ inputs.runOnImageName }}-${{ inputs.runOnImageVersion }}'
    environment: nuget-preview
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget-artifact
        path: packages
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Log in to NuGet.org with Trusted Publishing
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nugetUser }}
    - name: Push Package to NuGet.org
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $packages = @(Get-ChildItem packages -Recurse -Filter *.nupkg)
        if ($packages.Count -eq 0) {
          throw "No NuGet packages were downloaded"
        }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

  publish-release:
    name: "CD: Publish release"
    needs: build
    if: needs.build.outputs.release_publish == 'true'
    runs-on: '${{ inputs.runOnImageName }}-${{ inputs.runOnImageVersion }}'
    environment: nuget-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget-artifact
        path: packages
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Log in to NuGet.org with Trusted Publishing
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ inputs.nugetUser }}
    - name: Push Package to NuGet.org
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $packages = @(Get-ChildItem packages -Recurse -Filter *.nupkg)
        if ($packages.Count -eq 0) {
          throw "No NuGet packages were downloaded"
        }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }
